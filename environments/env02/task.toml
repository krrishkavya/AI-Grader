[task]
name = "solumn/env02"
version = "1.0.0"
description = "Log Compression CLI Service with custom file filter"

[metadata]
category = "code-security"
sub-category = "command-injection"
difficulty = "medium"
family = "family-1-shell"
variant_type = "variant-1"
changed_dimensions = ["facts", "framing"]

[environment]
docker_file = "environment/Dockerfile"
cpus = 2
memory_mb = 4096

[verifier]
timeout_sec = 300
command = ["bash", "/tests/test.sh"]
